name: Update portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Every 15 minutes, 07:00-21:59 UTC on weekdays (GitHub may delay scheduled runs).
    - cron: "*/15 7-21 * * 1-5"
    # Once a day at the weekend.
    - cron: "0 9 * * 0,6"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        name: Check for encrypted data
        run: |
          if [ -f private/bundle.enc ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "No private/bundle.enc yet: run publish.py on the Mac."; fi
      - if: steps.check.outputs.ready == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: steps.check.outputs.ready == 'true'
        run: pip install cryptography
      - if: steps.check.outputs.ready == 'true'
        name: Build encrypted site
        env:
          PORTFOLIO_PASSWORD: ${{ secrets.PORTFOLIO_PASSWORD }}
          PORTFOLIO_PASSWORD_JONATHAN: ${{ secrets.PORTFOLIO_PASSWORD_JONATHAN }}
        run: python build_static.py
      - if: steps.check.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    if: needs.build.outputs.ready == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
