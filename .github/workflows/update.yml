name: Update portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Every 15 minutes, 07:00-21:59 UTC on weekdays (GitHub may delay scheduled runs).
    - cron: "*/15 7-21 * * 1-5"
    # Once a day at the weekend.
    - cron: "0 9 * * 0,6"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cryptography
      - name: Build encrypted site
        env:
          PORTFOLIO_PASSWORD: ${{ secrets.PORTFOLIO_PASSWORD }}
        run: python build_static.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
