name: Update portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Only a safety net that restarts the chain if it ever breaks: each run starts the next
    # one itself (see "next"). GitHub often delays or skips scheduled runs.
    - cron: "17 */3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

# No workflow-level concurrency group: each run dispatches the next while it is still running,
# and GitHub sometimes left that queued run "pending" for 40+ minutes. The "next" job already
# makes sure only one update is in flight.

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        name: Check for encrypted data
        run: |
          if [ -f private/bundle.enc ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "No private/bundle.enc yet: run publish.py on the Mac."; fi
      - if: steps.check.outputs.ready == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: steps.check.outputs.ready == 'true'
        run: pip install cryptography
      - if: steps.check.outputs.ready == 'true'
        name: Build encrypted site
        env:
          PORTFOLIO_PASSWORD: ${{ secrets.PORTFOLIO_PASSWORD }}
          PORTFOLIO_PASSWORD_JONATHAN: ${{ secrets.PORTFOLIO_PASSWORD_JONATHAN }}
        run: python build_static.py
      - if: steps.check.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    if: needs.build.outputs.ready == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  next:
    # Keeps prices fresh without relying on GitHub's schedule (it often delays or skips runs):
    # every run starts the next one itself. Weekdays 07-21 UTC: every ~10 minutes. Otherwise
    # it keeps going once an hour, so the chain never stops and the morning needs no restart.
    needs: [build, deploy]
    if: always() && needs.build.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      actions: write
    steps:
      - name: Start the next update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          market() { [ "$(date -u +%u)" -le 5 ] && [ "$(date -u +%-H)" -ge 7 ] && [ "$(date -u +%-H)" -lt 21 ]; }
          if market; then
            sleep 540
          else
            # Wait up to 55 minutes, but wake every minute so the market open is not missed.
            for m in $(seq 1 55); do sleep 60; market && break; done
          fi
          # Another update in flight? The newest run carries the chain; older ones step aside.
          # A run stuck waiting in the queue for over 15 minutes is cancelled.
          now=$(date -u +%s); busy=0
          for r in $(gh run list -R "$GITHUB_REPOSITORY" -w update.yml -L 20 --json status,databaseId,createdAt \
                --jq '.[] | select(.status != "completed" and .databaseId > ${{ github.run_id }}) | "\(.databaseId),\(.status),\(.createdAt)"'); do
            id=${r%%,*}; rest=${r#*,}; st=${rest%%,*}; created=$(date -u -d "${rest#*,}" +%s)
            if [ "$st" != "in_progress" ] && [ $((now - created)) -gt 900 ]; then
              echo "Cancelling stuck run $id ($st since ${rest#*,})"; gh run cancel "$id" -R "$GITHUB_REPOSITORY" || true
            else busy=1; fi
          done
          if [ "$busy" = 1 ]; then echo "A newer update is already queued or running."; exit 0; fi
          gh workflow run update.yml -R "$GITHUB_REPOSITORY" --ref main
