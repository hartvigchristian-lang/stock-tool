name: Update portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # GitHub often delays or skips scheduled runs, so these only (re)start the chain:
    # each weekday run starts the next one itself about 10 minutes later (see "next").
    - cron: "7,37 7-20 * * 1-5"
    # Once a day at the weekend.
    - cron: "0 9 * * 0,6"

permissions:
  contents: read
  pages: write
  id-token: write

# No workflow-level concurrency group: each run dispatches the next while it is still running,
# and GitHub sometimes left that queued run "pending" for 40+ minutes. The "next" job already
# makes sure only one update is in flight.

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        name: Check for encrypted data
        run: |
          if [ -f private/bundle.enc ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "No private/bundle.enc yet: run publish.py on the Mac."; fi
      - if: steps.check.outputs.ready == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: steps.check.outputs.ready == 'true'
        run: pip install cryptography
      - if: steps.check.outputs.ready == 'true'
        name: Build encrypted site
        env:
          PORTFOLIO_PASSWORD: ${{ secrets.PORTFOLIO_PASSWORD }}
          PORTFOLIO_PASSWORD_JONATHAN: ${{ secrets.PORTFOLIO_PASSWORD_JONATHAN }}
        run: python build_static.py
      - if: steps.check.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    if: needs.build.outputs.ready == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  next:
    # Keeps prices fresh in market hours without relying on GitHub's schedule: wait ~10 minutes,
    # then start the next update, unless one is already queued or running.
    needs: [build, deploy]
    if: always() && needs.build.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
    steps:
      - name: Start the next update in market hours
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dow=$(date -u +%u); h=$(date -u +%H)
          if [ "$dow" -gt 5 ] || [ "$h" -lt 7 ] || [ "$h" -ge 21 ]; then echo "Outside market hours, chain stops."; exit 0; fi
          sleep 540
          # Another update already in flight (e.g. a scheduled one)? Let that one carry the chain,
          # unless it has been stuck waiting for over 15 minutes: then cancel it and go on.
          now=$(date -u +%s); busy=0
          for r in $(gh run list -R "$GITHUB_REPOSITORY" -w update.yml -L 20 --json status,databaseId,createdAt \
                --jq '.[] | select(.status != "completed" and .databaseId != ${{ github.run_id }}) | "\(.databaseId),\(.status),\(.createdAt)"'); do
            id=${r%%,*}; rest=${r#*,}; st=${rest%%,*}; created=$(date -u -d "${rest#*,}" +%s)
            if [ "$st" != "in_progress" ] && [ $((now - created)) -gt 900 ]; then
              echo "Cancelling stuck run $id ($st since ${rest#*,})"; gh run cancel "$id" -R "$GITHUB_REPOSITORY" || true
            else busy=1; fi
          done
          if [ "$busy" = 1 ]; then echo "Another update is already queued or running."; exit 0; fi
          gh workflow run update.yml -R "$GITHUB_REPOSITORY" --ref main
